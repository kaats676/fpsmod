name: Build Minecraft Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'adopt'
        
    - name: Show Java files (debug)
      run: |
        echo "=== Java files ==="
        find src -name "*.java" -type f
        echo "=== Content of FpsMod.java ==="
        cat src/main/java/com/kaats676/fpsmod/FpsMod.java 2>/dev/null || echo "File not found!"
        echo "=== Content of FpsOverlay.java ==="
        cat src/main/java/com/kaats676/fpsmod/FpsOverlay.java 2>/dev/null || echo "File not found!"
        
    - name: Download Gradle 6.8.3
      run: |
        wget https://services.gradle.org/distributions/gradle-6.8.3-bin.zip
        unzip gradle-6.8.3-bin.zip
        echo "$PWD/gradle-6.8.3/bin" >> $GITHUB_PATH
        
    - name: Compile with full error output
      run: |
        gradle clean compileJava --stacktrace 2>&1 | tee compile.log
        echo "=== Full compile log ==="
        cat compile.log
        
    - name: Build full mod
      run: gradle build --stacktrace
      
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: fps-mod
        path: build/libs/*.jar
